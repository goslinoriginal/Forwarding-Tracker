# Netlify reads this file when the project's base directory is "frontend"
# (paths here are relative to this folder). Mirrors ../netlify.toml.
[build]
command = "yarn build"
publish = "build"

[build.environment]
CI = "false"          # don't fail the build on lint warnings
NODE_VERSION = "20"   # react-scripts 5 builds reliably on Node 20

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
